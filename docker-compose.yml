services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: orders_db
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d orders_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  forecast-api:
    build: ./forecast_api
    restart: always
    expose:
      - "8001"

  orders-api:
    build: ./orders_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:postgres_password_123@db:5432/orders_db
      FORECAST_API_URL: http://forecast-api:8001/predict
    secrets:
      - jwt_secret
    depends_on:
      db:
        condition: service_healthy
      forecast-api:
        condition: service_started

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  db_data:
