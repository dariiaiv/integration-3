services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres_password_123
      POSTGRES_DB: orders_db
    volumes:
      - db_data:/var/lib/postgresql/data

  forecast-api:
    build: ./forecast_api
    restart: always
    expose:
      - "8001"

  orders-api:
    build: ./orders_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:postgres_password_123@db:5432/orders_db
      FORECAST_API_URL: http://forecast-api:8001/predict
    depends_on:
      - db
      - forecast-api

volumes:
  db_data: