services:
  db:
    image: postgres:15-alpine
    restart: always
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_123
      POSTGRES_DB: orders_db
    volumes:
      - db_data:/var/lib/postgresql/data

  forecast-api:
    build: ./forecast_api
    restart: always
    network_mode: host

  orders-api:
    build: ./orders_api
    restart: always
    network_mode: host
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_123@127.0.0.1:5432/orders_db
      FORECAST_API_URL: http://127.0.0.1:8001/predict
    depends_on:
      - db
      - forecast-api

volumes:
  db_data: